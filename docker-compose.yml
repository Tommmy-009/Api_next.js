services:
  upnext-backend:
    container_name: upnext-backend
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    ports:
      - "2367:2367"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:2367/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
